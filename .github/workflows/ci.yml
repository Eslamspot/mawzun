name: CI

# Every push and pull request must prove the same five gates the repository
# demands locally (see AGENTS.md): lint, engine behaviour, knowledge shape,
# docs integrity, and a production build. Bun only — never npm/yarn/pnpm.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Engine check (28/28)
        run: bun run engine:check

      - name: Knowledge check
        run: bun run knowledge:check

      - name: Docs check
        run: bun run docs:check

      - name: Production build
        run: bun run build
